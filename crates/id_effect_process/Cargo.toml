[package]
name = "id_effect_process"
version = "0.4.0"
edition = "2024"
description = "BEAM/OTP-style processes, links, monitors, and supervision trees for id_effect"
license = "CC-BY-SA-4.0"
repository = "https://github.com/Industrial/id_effect"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_process"

[dependencies]
id_effect = { path = "../id_effect", version = "0.4.0" }

[dev-dependencies]
pollster = "0.4"
tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
