[package]
name = "id_effect_parse"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parser combinators, pretty printing, invertible codecs, and value diffs for id_effect"
repository.workspace = true
readme = "README.md"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_parse"

[dependencies]
id_effect = { path = "../id_effect", version = "0.5.0" }

[dev-dependencies]
rstest = "0.26"
id_effect_proc_macro = { path = "../id_effect_proc_macro" }
