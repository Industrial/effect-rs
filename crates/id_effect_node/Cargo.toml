[package]
name = "id_effect_node"
version = "0.4.0"
edition = "2024"
description = "Distribution layer for the id_effect Process Mesh: node identity, cookie handshake, and pluggable transports (InMemory/TCP/QUIC)"
license = "CC-BY-SA-4.0"
repository = "https://github.com/Industrial/id_effect"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[lib]
name = "id_effect_node"

[features]
default = []
quic = ["dep:quinn", "dep:rustls", "dep:rcgen"]

[dependencies]
id_effect = { path = "../id_effect", version = "0.4.0" }
id_effect_process = { path = "../id_effect_process", version = "0.4.0" }
async-trait = "0.1"
bytes = "1"
flume = "0.11"
hmac = "0.12"
foca = { version = "1", features = ["std", "postcard-codec"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.50", features = ["rt", "net", "io-util", "sync", "time"] }
tracing = "0.1"

quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", optional = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
pollster = "0.4"
tokio = { version = "1.50", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
